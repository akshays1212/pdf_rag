<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glaxm Vault</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3347;
      --accent: #4f8ef7;
      --accent2: #43d9a2;
      --text: #c9d1e0;
      --text-dim: #6b7a99;
      --text-bright: #f0f4ff;
      --danger: #f75b5b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .logo { font-size: 18px; font-weight: 700; color: var(--text-bright); }
    .logo span { color: var(--accent); }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #555; display: inline-block; margin-right: 6px;
    }
    .status-dot.online { background: var(--accent2); }
    #status-text { font-size: 13px; color: var(--text-dim); }

    /* ── LAYOUT ── */
    .app {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 300px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-section {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    /* upload area */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-area:hover, .upload-area.drag { border-color: var(--accent); background: rgba(79,142,247,0.05); }
    .upload-area input { display: none; }
    .upload-icon { font-size: 28px; margin-bottom: 8px; }
    .upload-area p { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
    .upload-area small { font-size: 11px; color: var(--text-dim); opacity: 0.6; }

    /* file list */
    #file-list { margin-top: 12px; }
    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--surface2);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .file-item .file-icon { font-size: 16px; }
    .file-item .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .file-size { color: var(--text-dim); font-size: 11px; }

    /* index button */
    #index-btn {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #index-btn:hover { opacity: 0.85; }
    #index-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* session info */
    .session-info { font-size: 13px; color: var(--text-dim); }
    .session-badge {
      display: inline-block;
      background: rgba(79,142,247,0.15);
      color: var(--accent);
      border: 1px solid rgba(79,142,247,0.3);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      font-family: monospace;
      margin-top: 6px;
      word-break: break-all;
    }
    .stat-row { display: flex; justify-content: space-between; margin-top: 6px; }
    .stat-val { color: var(--text-bright); font-weight: 600; }

    /* clear btn */
    #clear-btn {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #clear-btn:hover { background: rgba(247,91,91,0.1); }

    /* ── CHAT AREA ── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      text-align: center;
      gap: 12px;
    }
    .empty-state .big-icon { font-size: 48px; }
    .empty-state h2 { color: var(--text); font-size: 20px; }
    .empty-state p { font-size: 14px; max-width: 320px; line-height: 1.6; }

    /* messages */
    .msg { display: flex; gap: 12px; align-items: flex-start; }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .msg.user .avatar { background: var(--accent); }
    .msg.assistant .avatar { background: var(--surface2); border: 1px solid var(--border); }
    .bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
    }
    .msg.user .bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    /* sources */
    .sources {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .source-chip {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
      margin: 2px;
      font-size: 11px;
    }

    /* chunks toggle */
    .chunks-toggle {
      margin-top: 8px;
      font-size: 12px;
      color: var(--accent);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }
    .chunks-toggle:hover { opacity: 0.8; }
    .chunks-panel {
      display: none;
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .chunks-panel.open { display: block; }
    .chunk-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .chunk-item:last-child { border-bottom: none; }
    .chunk-meta { color: var(--text-dim); margin-bottom: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
    .chunk-text { color: var(--text); line-height: 1.5; }
    .badge {
      padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600;
    }
    .badge-hybrid { background: rgba(255,193,7,0.15); color: #ffc107; }
    .badge-semantic { background: rgba(79,142,247,0.15); color: var(--accent); }
    .badge-keyword { background: rgba(67,217,162,0.15); color: var(--accent2); }
    .badge-unknown { background: rgba(107,122,153,0.15); color: var(--text-dim); }

    /* typing indicator */
    .typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-dim);
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── INPUT BAR ── */
    .input-bar {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #question-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-bright);
      font-size: 14px;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.2s;
    }
    #question-input:focus { border-color: var(--accent); }
    #question-input::placeholder { color: var(--text-dim); }
    #question-input:disabled { opacity: 0.5; }
    #send-btn {
      width: 42px; height: 42px;
      background: var(--accent);
      border: none; border-radius: 8px;
      color: #fff; font-size: 18px;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      flex-shrink: 0; transition: opacity 0.2s;
    }
    #send-btn:hover { opacity: 0.85; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* progress */
    #progress {
      padding: 0 24px 12px;
      font-size: 12px;
      color: var(--text-dim);
      display: none;
    }
    .progress-bar {
      height: 3px; background: var(--border);
      border-radius: 2px; margin-top: 6px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--accent);
      border-radius: 2px;
      animation: progress-anim 1.5s ease infinite;
    }
    @keyframes progress-anim {
      0% { width: 0%; margin-left: 0; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }

    /* toast */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 13px;
      display: none;
      z-index: 1000;
      max-width: 320px;
    }
    #toast.success { border-color: var(--accent2); color: var(--accent2); }
    #toast.error { border-color: var(--danger); color: var(--danger); }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">📄 GLAXM <span>Vault</span></div>
  <div>
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Not connected</span>
  </div>
</header>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <!-- Upload -->
    <div class="sidebar-section">
      <div class="sidebar-title">Upload Documents</div>
      <div class="upload-area" id="upload-area">
        <input type="file" id="file-input" accept=".pdf,.docx" multiple />
        <div class="upload-icon">📂</div>
        <p>Drop files here or click to browse</p>
        <small>PDF and DOCX supported</small>
      </div>
      <div id="file-list"></div>
      <button id="index-btn" disabled>Index Documents</button>
    </div>

    <!-- Session info -->
    <div class="sidebar-section" id="session-section" style="display:none">
      <div class="sidebar-title">Session</div>
      <div class="session-info">
        <div class="stat-row">
          <span>Pages indexed</span>
          <span class="stat-val" id="stat-pages">—</span>
        </div>
        <div class="stat-row">
          <span>Chunks</span>
          <span class="stat-val" id="stat-chunks">—</span>
        </div>
        <div class="stat-row">
          <span>History turns</span>
          <span class="stat-val" id="stat-history">0</span>
        </div>
        <div class="session-badge" id="session-id-display"></div>
      </div>
      <button id="clear-btn">🗑 Clear Session</button>
    </div>

  </div>

  <!-- CHAT -->
  <div class="chat-area">

    <!-- <div id="messages">
      <div class="empty-state" id="empty-state">
        <div class="big-icon">📄</div>
        <h2>Ask your documents</h2>
        <p>Upload a PDF or DOCX file on the left, then ask any question about its contents.</p>
      </div>
    </div> -->

    <div id="messages">
  <div class="msg assistant welcome-message" id="welcome-message">
    <div class="avatar">🤖</div>
    <div class="bubble">
      Hi! How can I help you today?
      Upload a document and I'll help you find the answers.
    </div>
  </div>
</div>

    <div id="progress">
      <span id="progress-label">Processing...</span>
      <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>

    <div class="input-bar">
      <textarea
        id="question-input"
        placeholder="Upload a document to start asking questions..."
        rows="1"
        disabled
      ></textarea>
      <button id="send-btn" disabled>➤</button>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
  const API = '';  // same origin — FastAPI serves this file
  let sessionId = null;
  let selectedFiles = [];
  let historyTurns = 0;

  // ── elements ──────────────────────────────────────────────────────
  const uploadArea    = document.getElementById('upload-area');
  const fileInput     = document.getElementById('file-input');
  const fileList      = document.getElementById('file-list');
  const indexBtn      = document.getElementById('index-btn');
  const sessionSection= document.getElementById('session-section');
  const sessionDisplay= document.getElementById('session-id-display');
  const statPages     = document.getElementById('stat-pages');
  const statChunks    = document.getElementById('stat-chunks');
  const statHistory   = document.getElementById('stat-history');
  const clearBtn      = document.getElementById('clear-btn');
  const messages      = document.getElementById('messages');
  const emptyState    = document.getElementById('empty-state');
  const questionInput = document.getElementById('question-input');
  const sendBtn       = document.getElementById('send-btn');
  const progress      = document.getElementById('progress');
  const progressLabel = document.getElementById('progress-label');
  const statusDot     = document.getElementById('status-dot');
  const statusText    = document.getElementById('status-text');
  const toast         = document.getElementById('toast');

  // ── health check ──────────────────────────────────────────────────
  async function checkHealth() {
    try {
      const r = await fetch(`${API}/health`);
      if (r.ok) {
        statusDot.classList.add('online');
        statusText.textContent = 'API connected';
      }
    } catch {
      statusText.textContent = 'API offline';
    }
  }
  checkHealth();

  // ── upload area ───────────────────────────────────────────────────
  uploadArea.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag'));
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });

  function handleFiles(files) {
    selectedFiles = Array.from(files).filter(f =>
      f.name.endsWith('.pdf') || f.name.endsWith('.docx')
    );
    renderFileList();
    indexBtn.disabled = selectedFiles.length === 0;
  }

  function renderFileList() {
    fileList.innerHTML = selectedFiles.map(f => `
      <div class="file-item">
        <span class="file-icon">${f.name.endsWith('.pdf') ? '📄' : '📝'}</span>
        <span class="file-name">${f.name}</span>
        <span class="file-size">${(f.size / 1024).toFixed(0)}KB</span>
      </div>
    `).join('');
  }

  // ── index documents ───────────────────────────────────────────────
  indexBtn.addEventListener('click', async () => {
    if (!selectedFiles.length) return;

    indexBtn.disabled = true;
    indexBtn.textContent = 'Indexing...';
    showProgress('Reading and indexing documents...');

    const formData = new FormData();
    selectedFiles.forEach(f => formData.append('files', f));

    try {
      const r = await fetch(`${API}/upload`, { method: 'POST', body: formData });
      const data = await r.json();

      if (!r.ok) throw new Error(data.detail || 'Upload failed');

      sessionId = data.session_id;
      historyTurns = 0;

      // update UI
      sessionDisplay.textContent = sessionId.slice(0, 8) + '...';
      statPages.textContent = data.pages;
      statChunks.textContent = data.chunks;
      statHistory.textContent = '0';
      sessionSection.style.display = 'block';

      // enable chat
      questionInput.disabled = false;
      questionInput.placeholder = 'Ask a question about your documents...';
      sendBtn.disabled = false;

      showToast(`✅ ${data.message} — ${data.pages} pages, ${data.chunks} chunks`, 'success');
      hideProgress();
      indexBtn.textContent = 'Re-index';
      indexBtn.disabled = false;

    } catch (e) {
      showToast(`❌ ${e.message}`, 'error');
      hideProgress();
      indexBtn.disabled = false;
      indexBtn.textContent = 'Index Documents';
    }
  });

  // ── send question ─────────────────────────────────────────────────
  sendBtn.addEventListener('click', sendQuestion);
  questionInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
  });

  // auto-resize textarea
  questionInput.addEventListener('input', () => {
    questionInput.style.height = 'auto';
    questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + 'px';
  });

  async function sendQuestion() {
    const q = questionInput.value.trim();
    if (!q || !sessionId) return;

    questionInput.value = '';
    questionInput.style.height = 'auto';
    sendBtn.disabled = true;
    questionInput.disabled = true;

    // hide empty state
    // emptyState.style.display = 'none';

    // add user message
    appendMessage('user', q);

    // add typing indicator
    const typingId = appendTyping();
    showProgress('Searching and generating answer...');

    try {
      const r = await fetch(`${API}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: sessionId,
          question: q,
          candidate_k: 20,
          top_k: 5,
        }),
      });

      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || 'Request failed');

      removeTyping(typingId);
      appendAssistantMessage(data.answer, data.final_chunks);

      historyTurns = data.history_turns;
      statHistory.textContent = historyTurns;

    } catch (e) {
      removeTyping(typingId);
      appendMessage('assistant', `❌ Error: ${e.message}`);
    }

    hideProgress();
    sendBtn.disabled = false;
    questionInput.disabled = false;
    questionInput.focus();
  }

  // ── message helpers ───────────────────────────────────────────────
  function appendMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
      <div class="bubble">${escapeHtml(text)}</div>
    `;
    messages.appendChild(div);
    scrollToBottom();
    return div;
  }

  function appendAssistantMessage(text, chunks) {
    const div = document.createElement('div');
    div.className = 'msg assistant';

    // extract source pages
    const pages = [...new Set(chunks.map(c => c.page_number))].sort((a,b)=>a-b);
    const sourcesHtml = pages.length
      ? `<div class="sources">📍 Sources: ${pages.map(p => `<span class="source-chip">Page ${p}</span>`).join('')}</div>`
      : '';

    // chunks panel
    const toggleId = 'chunks-' + Date.now();
    const chunksHtml = chunks.length ? `
      <div class="chunks-toggle" onclick="toggleChunks('${toggleId}')">
        ▶ Show ${chunks.length} retrieved chunks
      </div>
      <div class="chunks-panel" id="${toggleId}">
        ${chunks.map((c, i) => `
          <div class="chunk-item">
            <div class="chunk-meta">
              <span class="badge badge-${c.retrieval_source}">${c.retrieval_source}</span>
              <span>Page ${c.page_number}</span>
              <span>RRF: ${c.rrf_score.toFixed(4)}</span>
              <span>Rerank: ${c.rerank_score.toFixed(4)}</span>
            </div>
            <div class="chunk-text">${escapeHtml(c.text.slice(0, 250))}${c.text.length > 250 ? '...' : ''}</div>
          </div>
        `).join('')}
      </div>
    ` : '';

    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble">
        ${escapeHtml(text)}
        ${sourcesHtml}
        ${chunksHtml}
      </div>
    `;
    messages.appendChild(div);
    scrollToBottom();
  }

  function appendTyping() {
    const id = 'typing-' + Date.now();
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.id = id;
    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble">
        <div class="typing"><span></span><span></span><span></span></div>
      </div>
    `;
    messages.appendChild(div);
    scrollToBottom();
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function toggleChunks(id) {
    const panel = document.getElementById(id);
    const toggle = panel.previousElementSibling;
    const isOpen = panel.classList.toggle('open');
    toggle.textContent = (isOpen ? '▼ Hide' : '▶ Show') +
      ` ${panel.querySelectorAll('.chunk-item').length} retrieved chunks`;
  }

  // ── clear session ─────────────────────────────────────────────────
  clearBtn.addEventListener('click', async () => {
    if (!sessionId) return;
    try {
      await fetch(`${API}/session/${sessionId}`, { method: 'DELETE' });
    } catch {}

    sessionId = null;
    historyTurns = 0;
    messages.innerHTML = '';
    messages.appendChild(emptyState);
    emptyState.style.display = 'flex';
    sessionSection.style.display = 'none';
    questionInput.disabled = true;
    questionInput.placeholder = 'Upload a document to start asking questions...';
    sendBtn.disabled = true;
    fileList.innerHTML = '';
    selectedFiles = [];
    indexBtn.disabled = true;
    indexBtn.textContent = 'Index Documents';
    showToast('Session cleared', 'success');
  });

  // ── utils ─────────────────────────────────────────────────────────
  function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/\n/g,'<br>');
  }

  function showProgress(label) {
    progressLabel.textContent = label;
    progress.style.display = 'block';
  }

  function hideProgress() {
    progress.style.display = 'none';
  }

  function showToast(msg, type = 'success') {
    toast.textContent = msg;
    toast.className = type;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 4000);
  }
</script>
</body>
</html>
